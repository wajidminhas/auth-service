

# docker-compose.yml

services:

  # ─── PostgreSQL Database ────────────────────────────────────────
  db:
    image: postgres:15-alpine
    container_name: auth_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: auth_db
    ports:
      # host:container
      # Access database from your machine at localhost:5432
      - "5432:5432"
    volumes:
      # Persist data even when container restarts
      # Without this — all data lost when container stops
      - postgres_data:/var/lib/postgresql/data
    networks:
      - auth_network
    healthcheck:
      # Check if database is ready before starting other services
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Zookeeper ──────────────────────────────────────────────────
  # Kafka needs Zookeeper to manage its cluster
  # Think of Zookeeper as Kafka's manager
  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: auth_zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - auth_network
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "2181"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Kafka Broker ───────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: auth_kafka
    # Wait for zookeeper to be healthy before starting
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      # Access Kafka from your machine at localhost:9092
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      # Two listeners:
      # PLAINTEXT — for internal container communication
      # PLAINTEXT_HOST — for external access from your machine
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    networks:
      - auth_network
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 5

  # ─── Auth Service ───────────────────────────────────────────────
  auth_service:
    # Build from our Dockerfile
    build: .
    container_name: auth_service
    # Wait for db and kafka to be healthy before starting
    depends_on:
      db:
        condition: service_healthy
      kafka:
        condition: service_healthy
    ports:
      # Access FastAPI at localhost:8000
      - "8000:8000"
    environment:
      # Override .env values for Docker environment
      # db is the service name — Docker resolves it automatically
      DATABASE_URL: postgresql://postgres:password@db:5432/auth_db
      # kafka is the service name — Docker resolves it automatically
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      SECRET_KEY: fc3caf8bec3e4d6d7de0d93f824f25a5a51558f2f67ae38607ad0f122fa55a2e
      ALGORITHM: HS256
      ACCESS_TOKEN_EXPIRE_MINUTES: 30
      OTP_EXPIRE_MINUTES: 15
      KAFKA_TOPIC: auth-events
      APP_NAME: Auth Service
    networks:
      - auth_network
    # Restart automatically if container crashes
    restart: on-failure


# ─── Volumes ──────────────────────────────────────────────────────
# Named volumes persist data outside containers
volumes:
  postgres_data:


# ─── Networks ─────────────────────────────────────────────────────
# All services on same network can talk to each other by name
# auth_service connects to db using hostname 'db'
# auth_service connects to kafka using hostname 'kafka'
networks:
  auth_network:
    driver: bridge